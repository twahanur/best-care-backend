services:
  # 1. Python FastAPI AI Service
  - type: web
    name: bestcare-ai-service
    runtime: docker
    dockerContext: ./ai-service
    dockerfilePath: ./ai-service/Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: AI_SERVICE_HOST
        value: 0.0.0.0
      - key: AI_SERVICE_PORT
        value: 8000
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.6-flash,gemini-3.5-flash,gemini-3.7-flash,gemini-2.5-flash-lite,gemini-1.5-flash
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001

  # 2. NestJS Core Backend Gateway
  - type: web
    name: bestcare-backend-gateway
    runtime: docker
    dockerContext: ./backend-gateway
    dockerfilePath: ./backend-gateway/Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: bestcare-ai-service
          property: host
